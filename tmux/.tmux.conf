# Set the prefix to Ctrl+a
set -g prefix M-a

# Remove the old prefix
unbind C-b

# Send Alt+a to applications by pressing it twice
bind M-a send-prefix

set -g mouse on
set -g history-limit 100000

# Pass certain commands to apps instead tmux intercepting them
set -g default-terminal "tmux-256color"
set -g xterm-keys on

# Add ctrl arrow to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Copy goes to the system clipboard via the terminal (OSC 52, set-clipboard external default)
# Paste with the terminal's native binding: Ctrl+Shift+V or Shift+Insert
